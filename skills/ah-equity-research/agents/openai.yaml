interface:
  display_name: "A/H股公司深度研究"
  short_description: "研究行业与公司竞争力，结合Excel模型生成结论先行、定量论证充分、图表专业的中文深度研报"
  default_prompt: "使用 $ah-equity-research，结合我的Excel模型与指定截止日信息，先完成研究底稿与预期差分析，再生成结论先行、产业机制与定量论证充分、附录丰富的Word与PDF公司深度研报。把行业和竞争力分析落实到量价、成本、利润及估值，不写抽象框架或泛金融科普。采用中文楷体、英文数字Times New Roman与机构研究版式：细线分隔与留白、粗体图题配顶线、三线表与浅灰预测列、海军蓝单主色。图表下只列真实简短资料来源，重要假设和风险在正文或方法表集中交代。"
